# Exmoor ponies: a native moorland breed, among the hardiest of British ponies, grazing coarse grass and
# browsing gorse, bramble and young scrub the year round. Used to hold back scrub on rough grazing.
# Sources: The Exmoor Pony Society; Natural England conservation grazing guidance.
id = "exmoor_ponies"
name = "Exmoor ponies"
works_per_head = 3   # works per head to bring a herd in
works_upkeep_per_head = 0.5   # works each head costs every season (feed, vet, a herdsman)
need_per_head = 1.0
grazing_pressure_per_ha = 0.35
recovery_per_week = 0.04
loss_per_week = 0.05               # hardy: they hold condition through a poor winter
attrition_below = 0.25
attrition_per_week = 0.02
movement_cost_per_cell = 0.004
max_size = 100

[forage]
herb = 0.4
shrub = 0.12
tree = 0.02

# Browsing holds back scrub.
[[effects]]
layer = "shrub"
clears_per_ha = 0.02
