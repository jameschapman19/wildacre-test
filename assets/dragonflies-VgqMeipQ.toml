# Dragonflies and damselflies (Odonata), treated as one group. Larvae live in still or slow water for one
# to several years, so ponds, ditches, wetland and a clean stream matter; adults hunt over water and nearby
# rough ground. Signal crayfish eat larvae heavily. Adults are the main summer prey of the hobby.
# Sources: British Dragonfly Society species accounts and Brooks & Lewington, Field Guide to the
# Dragonflies and Damselflies of Britain and Ireland. Rates tuned to the weekly step.
id = "dragonflies"
name = "Dragonflies"
capacity_per_ha = 20.0
growth_per_week = 0.08
mortality_per_week = 0.03
dispersal_per_week = 0.15
dispersal_radius = 3               # flies over gaps in suitable habitat
step_weeks = 4
phase_weeks = 3
extinction_density = 0.02
initial_fraction = 0.3
detection = 0.15                # spring survey: adults counted on transects by water

[habitat_preference]
wetland = 1.0
open_water = 0.9
scrub = 0.15
rough = 0.12
open_woodland = 0.1
improved = 0.04

# Water at or near the surface.
[[responses]]
variable = "water_table"
zero_below = -1.0
full_from = -0.5
full_to = 0.25
zero_above = 0.7

[sighting]
group = "insect"
seasonal_visibility = [0.3, 1.0, 0.5, 0.0]  # spring, summer, autumn, winter: on the wing from late spring to autumn
