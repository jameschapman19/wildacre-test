id = "improved"
name = "Improved grassland"

# Classification: habitats are tested from the highest priority down and the first whose conditions
# all hold wins. The lowest-priority habitat has no conditions and is the fallback. A margin keeps a
# cell in this habitat a little beyond the bounds, so cells on a threshold do not flicker.
guild = "grassland"
priority = 40
works_per_cell_per_season = 0.004   # farming income: works each cell adds to the estate's seasonal allowance
farmed = true   # the works it earns are crops, which wildlife can damage

# Starting soil fertility and vegetation cover for cells of this habitat.
initial_nutrients = 0.7

[initial_cover]
herb = 0.9
shrub = 0.0
tree = 0.0

[[conditions]]
variable = "herb_cover"
min = 0.45
margin = 0.12

[[conditions]]
variable = "nutrients"
min = 0.5

[[conditions]]
variable = "grazing_pressure"
min = 0.2
margin = 0.1
