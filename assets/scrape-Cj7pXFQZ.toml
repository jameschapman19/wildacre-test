# Cut scrape: a shallow, seasonal, hand-dug pool. Scrapes are typically 20 to 50 cm deep, hold winter
# rain and dry out in summer, which suits wading birds and dragonflies. The pool holds surface water
# before any runs off; it empties by infiltration and evaporation.
id = "scrape"
name = "Cut scrape"
works_per_cell = 6   # works for each cell the tool changes
unlock = { habitat = "wetland", min_cells = 700 }   # once the estate holds some wet ground

[[effects]]
pool_capacity_mm = 300.0
