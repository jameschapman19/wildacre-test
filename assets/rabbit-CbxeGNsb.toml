# European rabbit (Oryctolagus cuniculus): introduced in the Middle Ages, now the staple prey of foxes and
# buzzards and a heavy grazer of short turf. Breeds from early in the year to late summer; a doe can raise
# several litters, so numbers recover fast from crashes. Local densities of 10 to 50 per hectare are common
# on well-drained, closely grazed ground with cover to retreat to; myxomatosis and RHD cause periodic crashes
# (not modelled: the crashes here come from the food web and forage).
# Sources: Mammal Society species account; Harris & Yalden, Mammals of the British Isles.
id = "rabbit"
name = "Rabbit"
works_per_season = 0.5   # works a season the species adds to the estate once established: the food web pays
works_full_population = 5000   # individuals on the estate's own land at which it pays in full
capacity_per_ha = 20.0
growth_per_week = 0.08
mortality_per_week = 0.012
dispersal_per_week = 0.05
step_weeks = 8
phase_weeks = 7
extinction_density = 0.01
initial_fraction = 0.4
grazing_pressure_per_ha = 0.003    # at 20 per hectare, 0.06 pressure: a short sward but scrub survives
detection = 0.5                # spring survey: dusk spotlight counts
crop_damage_per_ha = 0.012   # share of a field's yield lost per animal per hectare: deer in the crop

[habitat_preference]
improved = 0.9
rough = 0.7
scrub = 0.6
arable = 0.5
open_woodland = 0.5
bare = 0.2
wetland = 0.1

# Needs grass to eat.
[[responses]]
variable = "herb_cover"
zero_below = 0.1
full_from = 0.5
full_to = 2.0
zero_above = 3.0

[sighting]
group = "mammal"
seasonal_visibility = [1.0, 1.0, 1.0, 1.0]
