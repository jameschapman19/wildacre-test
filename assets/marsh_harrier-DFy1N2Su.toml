# Western marsh harrier (Circus aeruginosus): a large raptor of reedbeds and wet grassland that quarters low over
# open ground for small mammals, young waterbirds and carrion. It was down to a single nest in England in 1971 and
# has recovered wherever wetland of a few dozen hectares has been restored. Pairs hold territories of a few
# hundred hectares, so it is a good test that a wetland is big enough and has a prey base around it.
# Sources: RSPB species account and BTO BirdFacts. Rates tuned to the game's weekly step. Not present at the
# start; arrives from the wider countryside.
id = "marsh_harrier"
name = "Marsh harrier"
capacity_per_ha = 0.004
growth_per_week = 0.0
mortality_per_week = 0.006
dispersal_per_week = 0.06
dispersal_radius = 4               # ranges over open ground between wetlands
step_weeks = 13
phase_weeks = 6
extinction_density = 0.000005
initial_fraction = 0.0
detection = 0.5                # spring survey: large and conspicuous over reed in the breeding season

[habitat_preference]
wetland = 1.0
rough = 0.25
open_water = 0.4
improved = 0.05
arable = 0.05
scrub = 0.1

[[eats]]
prey = "field_vole"
max_intake_per_week = 20.0
half_saturation = 40.0
efficiency = 0.0004
max_fraction = 0.3

[[eats]]
prey = "rabbit"
max_intake_per_week = 3.0
half_saturation = 8.0
efficiency = 0.0006
max_fraction = 0.3

[sighting]
group = "bird"
seasonal_visibility = [1.0, 1.0, 0.7, 0.4]
names = ["Reed", "Quill", "Harrow", "Fen", "Sable", "Tarn"]  # individuals the player comes to know, in the order they are first seen
