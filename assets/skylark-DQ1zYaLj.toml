# Eurasian skylark (Alauda arvensis): nests on the ground in open fields, needing short, patchy vegetation
# and no tall cover close by. Declined sharply with intensive winter cereals, which grow too dense by the
# time of the second brood. Spring-sown crops, fallow, rough pasture and light grazing hold more. Density
# in good open habitat is around 0.3 to 0.6 territories per hectare.
# Sources: BTO BirdFacts and RSPB research on skylark and cereal management. Rates tuned to the weekly step.
id = "skylark"
name = "Skylark"
capacity_per_ha = 0.6
growth_per_week = 0.03
mortality_per_week = 0.01
dispersal_per_week = 0.1
dispersal_radius = 2               # flies over gaps in suitable habitat
step_weeks = 8
phase_weeks = 3
extinction_density = 0.005
initial_fraction = 0.5
detection = 0.5                # spring survey: singing males mapped on territory counts

[habitat_preference]
rough = 1.0
improved = 0.6
arable = 0.25
bare = 0.3

# Open country: no scrub or trees close by.
[[responses]]
variable = "shrub_cover"
zero_below = -1.0
full_from = -0.5
full_to = 0.05
zero_above = 0.45

# Not heavily grazed to bare ground, and not smothered.
[[responses]]
variable = "grazing_pressure"
zero_below = -1.0
full_from = -0.5
full_to = 0.4
zero_above = 0.9

[sighting]
group = "bird"
seasonal_visibility = [1.0, 1.0, 0.6, 0.5]
