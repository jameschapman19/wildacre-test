# Eurasian beaver (Castor fiber): the ecosystem engineer. Absent at the start; the player releases it (M3).
# Lives in family groups on slow water with trees to eat and build with. Dams hold surface water and spread
# it onto the surrounding ground, and beavers fell trees near the water.
# Sources: Beaver Trust and Scottish Beavers / Devon Beaver Project summaries of British beaver ecology
# (territory lengths of one to three kilometres of watercourse, family groups of four to six, dam building),
# and Gurnell et al. work on beaver effects in Britain. Density is per hectare of cell, so 0.15 is a family
# group on about thirty hectares of waterside. Rates are tuned to the game's weekly step.
id = "eurasian_beaver"
name = "Eurasian beaver"
works_per_season = 8.0   # works a season the species adds to the estate once established: the food web pays
works_full_population = 4   # individuals on the estate's own land at which it pays in full
capacity_per_ha = 0.15
growth_per_week = 0.006          # a population grows by roughly a quarter a year
mortality_per_week = 0.002
dispersal_per_week = 0.02
step_weeks = 13
phase_weeks = 11
extinction_density = 0.001
initial_fraction = 0.0

release_density = 0.15            # a family of about four over the 5 by 5 hectares around the release point
release_works = 160       # works to release a founding family
unlock = { habitat = "wetland", min_cells = 700 }   # a family needs a wet valley to settle
detection = 0.3                # spring survey: signs counted: lodges, dams, feeding
engineers = "wetland"            # its dams and felling make wetland for other species

[habitat_preference]
open_water = 1.0
wetland = 0.8
open_woodland = 0.4
scrub = 0.3
closed_woodland = 0.3
rough = 0.1

# Needs water at or near the surface; dry ground is no use however wooded.
[[responses]]
variable = "water_table"
zero_below = -1.0
full_from = -0.5
full_to = 0.3
zero_above = 0.9

# Dams: hold surface water and let it soak into the banks.
[[effects]]
kind = "retain_water"
rate_mm_per_ha = 300.0

# Felling: strips trees close to the water.
[[effects]]
kind = "clear"
layer = "tree"
rate_per_ha = 0.05

[sighting]
group = "mammal"
seasonal_visibility = [0.5, 0.7, 0.8, 0.4]  # spring, summer, autumn, winter: mostly out at dusk, so little of it is in view
names = ["Alder", "Willow", "Hazel", "Rowan", "Aspen", "Osier"]  # individuals the player comes to know, in the order they are first seen
