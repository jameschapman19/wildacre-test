# Field vole (Microtus agrestis): the engine of the grassland food web.
# Lives in long, tussocky grass with a thick litter layer, so it needs herb cover and little grazing.
# Densities are individuals per hectare: typically tens, with peaks of a few hundred in good years.
# Sources: Mammal Society species account and Harris & Yalden, Mammals of the British Isles (population
# ranges, breeding season, habitat). Rates are tuned to the game's weekly step, not copied from a table.
id = "field_vole"
name = "Field vole"
works_per_season = 0.5   # works a season the species adds to the estate once established: the food web pays
works_full_population = 20000   # individuals on the estate's own land at which it pays in full
capacity_per_ha = 150.0
growth_per_week = 0.25          # several litters a season: a fast-growing, fast-crashing population
mortality_per_week = 0.01
dispersal_per_week = 0.05
step_weeks = 4                  # updated monthly over the whole interval, population intervals trade temporal detail for speed
phase_weeks = 0
extinction_density = 0.01
initial_fraction = 0.4
detection = 0.01                # spring survey: only the grass runs and owl pellets show them; trapping samples a sliver

[habitat_preference]
rough = 1.0
wetland = 0.6
scrub = 0.5
open_woodland = 0.4
improved = 0.2
arable = 0.1
closed_woodland = 0.1

# Needs a long sward...
[[responses]]
variable = "herb_cover"
zero_below = 0.2
full_from = 0.6
full_to = 1.0
zero_above = 1.01

# ...that is not grazed short.
[[responses]]
variable = "grazing_pressure"
zero_below = -1.0
full_from = -0.5
full_to = 0.15
zero_above = 0.6

[sighting]
group = "mammal"
seasonal_visibility = [0.5, 0.6, 0.7, 0.2]
