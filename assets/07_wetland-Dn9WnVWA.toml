id = "wetland"
name = "Wetland"

# Classification: habitats are tested from the highest priority down and the first whose conditions
# all hold wins. The lowest-priority habitat has no conditions and is the fallback. A margin keeps a
# cell in this habitat a little beyond the bounds, so cells on a threshold do not flicker.
guild = "wetland"
priority = 85
works_per_cell_per_season = 0.02   # works each cell of this habitat adds to the estate's seasonal allowance
yield_group = "wetland"                  # cells of a group pay less each as the group takes over the estate

# Starting soil fertility and vegetation cover for cells of this habitat.
initial_nutrients = 0.5

[initial_cover]
herb = 0.8
shrub = 0.0
tree = 0.0

[[conditions]]
variable = "water_table"
max = 0.35
margin = 0.2

[[conditions]]
variable = "tree_cover"
max = 0.35
margin = 0.05

[[conditions]]
variable = "shrub_cover"
max = 0.5
margin = 0.15
