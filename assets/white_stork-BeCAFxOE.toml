# White stork (Ciconia ciconia): a large wading bird that nests on tall trees, poles and rooftops and feeds
# in wet meadows and shallow wetland on frogs, insects, earthworms and small mammals. It last bred in
# Britain around 1416 and has been returning through the White Stork Project reintroduction at Knepp and
# elsewhere in Sussex, where the first chicks hatched in 2020. It is the estate's flagship: it only settles
# where there is a lot of wet ground and wetland prey, so it has to be earned. Prey here is the wetland
# insects (dragonflies stand in for the amphibians and invertebrates the roster does not model).
# Sources: RSPB and BTO species accounts, and the White Stork Project's published reintroduction notes.
# Densities are per hectare of cell: one pair needs a few hundred hectares of wet foraging.
id = "white_stork"
name = "White stork"
works_per_season = 8.0   # works a season the species adds to the estate once established: the food web pays
works_full_population = 3   # individuals on the estate's own land at which it pays in full
capacity_per_ha = 0.004
growth_per_week = 0.0
mortality_per_week = 0.004
dispersal_per_week = 0.05
dispersal_radius = 4               # a wide-ranging flier that searches for wet ground
step_weeks = 13
phase_weeks = 6
extinction_density = 0.00001
initial_fraction = 0.0
detection = 0.7                # spring survey: huge, white and conspicuous on open ground

[habitat_preference]
wetland = 1.0
open_water = 0.3
rough = 0.1
improved = 0.05
arable = 0.02

# Wet ground: the water table at or just under the surface.
[[responses]]
variable = "water_table"
zero_below = -1.0
full_from = -0.3
full_to = 0.5
zero_above = 1.3

[[eats]]
prey = "dragonflies"
max_intake_per_week = 150.0
half_saturation = 12.0
efficiency = 0.00015
max_fraction = 0.3

[sighting]
group = "bird"
seasonal_visibility = [1.0, 1.0, 0.5, 0.1]  # spring, summer, autumn, winter: mostly a summer bird
names = ["Marlow", "Pippin", "Tansy", "Wick", "Gorse", "Fenny"]  # individuals the player comes to know, in the order they are first seen
