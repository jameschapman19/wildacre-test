# English Longhorn cattle: a heritage beef breed widely used for conservation grazing because it is hardy,
# grazes coarse grass, and its trampling and dunging break up the sward and make seedbeds without clearing
# scrub. Sources: Rare Breeds Survival Trust breed notes; Natural England conservation grazing guidance
# (typically 0.1 to 0.5 cattle per hectare year-round on rough grassland). One head needs one head-week of
# forage a week; a hectare of full grass sward yields about half a head-week.
id = "english_longhorn_cattle"
name = "English Longhorn cattle"
works_per_head = 4   # works per head to bring a herd in
works_upkeep_per_head = 0.8   # works each head costs every season (feed, vet, a herdsman)
unlock = { year = 1 }
need_per_head = 1.0
grazing_pressure_per_ha = 0.5      # a head per hectare is heavy grazing
recovery_per_week = 0.04
loss_per_week = 0.08               # about three months unfed to reach the attrition threshold
attrition_below = 0.3
attrition_per_week = 0.03
movement_cost_per_cell = 0.004     # 50 cells (about 7 km at hectare scale) costs a fifth of condition
max_size = 200

[forage]
herb = 0.5
shrub = 0.05

# Trampling and dunging break up the sward.
[[effects]]
layer = "herb"
clears_per_ha = 0.002
