# Red fox (Vulpes vulpes): a generalist predator of rabbits, voles and ground-nesting birds, with territories
# of 50 to 200 hectares in farmland (0.01 to 0.03 per hectare). It does not need any one habitat but does
# best with cover to den in. With no persecution its numbers follow its prey, with a lag.
# Sources: Mammal Society species account; Harris & Yalden. Intake: roughly half a kilogram a day, a few
# rabbits or many dozens of voles a week. Rates tuned to the game's weekly step.
id = "red_fox"
name = "Red fox"
capacity_per_ha = 0.03
growth_per_week = 0.0
mortality_per_week = 0.003
dispersal_per_week = 0.04
step_weeks = 13
phase_weeks = 3
extinction_density = 0.00003
initial_fraction = 0.3
detection = 0.15                # spring survey: nocturnal; thermal and camera surveys catch few

[habitat_preference]
rough = 1.0
scrub = 1.0
open_woodland = 1.0
closed_woodland = 0.8
improved = 0.6
arable = 0.5
wetland = 0.4
bare = 0.2

[[eats]]
prey = "rabbit"
max_intake_per_week = 3.5
half_saturation = 8.0
efficiency = 0.004
max_fraction = 0.3

[[eats]]
prey = "field_vole"
max_intake_per_week = 25.0
half_saturation = 40.0
efficiency = 0.0007
max_fraction = 0.3

[sighting]
group = "mammal"
seasonal_visibility = [1.0, 1.0, 1.0, 1.0]
names = ["Bracken", "Sorrel", "Russet", "Ember", "Fennel", "Copper"]  # individuals the player comes to know, in the order they are first seen
