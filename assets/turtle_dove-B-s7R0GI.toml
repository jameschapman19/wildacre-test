# European turtle dove (Streptopelia turtur): a summer migrant that nests in tall, thick hedges and scrub
# and feeds on the seeds of arable weeds and fumitory on bare or sparsely vegetated ground nearby. One of
# the fastest-declining British birds, lost with hedgerow neglect and cleaner crops. Needs both a nest
# thicket and a seed supply, so it is a fussy indicator of mixed, structured land.
# Sources: RSPB Operation Turtle Dove and BTO BirdFacts. Rates tuned to the weekly step. Not present at
# the start; arrives from the wider countryside.
id = "turtle_dove"
name = "Turtle dove"
capacity_per_ha = 0.05
growth_per_week = 0.015
mortality_per_week = 0.007
dispersal_per_week = 0.06
dispersal_radius = 3               # flies over gaps in suitable habitat
step_weeks = 8
phase_weeks = 2
extinction_density = 0.00005
initial_fraction = 0.0
detection = 0.25                # spring survey: purring males, secretive and easily missed

[habitat_preference]
scrub = 1.0
open_woodland = 0.6
rough = 0.5
arable = 0.3
wetland = 0.2

# A nesting thicket.
[[responses]]
variable = "shrub_cover"
zero_below = 0.1
full_from = 0.4
full_to = 0.9
zero_above = 1.01

# Browsing thins the thicket.
[[responses]]
variable = "grazing_pressure"
zero_below = -1.0
full_from = -0.5
full_to = 0.1
zero_above = 0.5

[sighting]
group = "bird"
seasonal_visibility = [0.8, 1.0, 0.2, 0.0]  # spring, summer, autumn, winter: a summer visitor
