# Vegetation: three layers of cover (0 to 1 of a hectare cell) that grow, compete for light, seed into
# neighbouring cells and are removed by grazing. Habitat is classified from these, never set directly.
# Shrub and tree seed_per_week weight the summed seed-source cover of neighbouring cells; the herb value is a
# constant seed bank. Moisture ranges are soil saturation (0 to 1).

